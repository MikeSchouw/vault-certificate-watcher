<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault certificates</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main><header><div><p class="brand">Vault / Certificate watcher</p><h1>Certificates</h1><p id="sync" role="status">Connecting to Vault…</p></div><button id="refresh">Refresh now</button></header><p id="error" role="alert" hidden></p><section class="tools" aria-label="Certificate filters"><label class="search">Search certificates<input id="search" type="search" placeholder="Subject, name, issuer, or serial"></label><label class="check"><input id="history" type="checkbox"> Show expired and revoked</label></section><p id="count"></p><div class="inspector"><nav id="certificates" aria-label="Certificates by nearest expiry"></nav><section id="details" aria-label="Selected certificate details" hidden><p class="detail-label" id="mount"></p><h2 id="subject"></h2><p id="status"></p><p id="remaining"></p><p id="expires"></p><dl id="fields"></dl></section><p id="empty">No certificate data is available yet.</p></div><footer>Only certificates still stored in Vault are shown. Times use your local time zone.</footer></main></body></html>
